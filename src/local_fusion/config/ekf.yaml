local_ekf:
  ros__parameters:

    #Gouda: I changed this to true to use the simulation time of Gazebo.
    use_sim_time: true

    frequency: 15.0
    two_d_mode: true

    # =========================
    # INPUTS
    # =========================
    odom0: /odom_raw

    odom0_config: [true, true, false,
                   false, false, true,
                   true, false, false,
                   false, false, true,
                   false, false, false]

    odom0_differential: false
    odom0_relative: false

    # IMU (Ready for the future)
    imu0: /imu/data_raw

    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]

    imu0_remove_gravitational_acceleration: true

    imu0_differential: false
    imu0_relative: false

    # =========================
    # OUTPUT
    # =========================
    odom_frame: odom
    base_link_frame: base_link


    #Gouda: I suspect this should be map, but I will test it with odom first to see if it works.
    world_frame: odom


    publish_tf: true
