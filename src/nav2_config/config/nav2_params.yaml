planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"  # 🔴 FIXED
      tolerance: 0.125
      motion_model_type: "DubinsMotion"
      allow_unknown: true

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    bt_xml_filename: "navigate_w_replanning_and_recovery.xml"  # 🔴 ADDED
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"  # 🔴 ADDED
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.2    # 🔴 REDUCED from 1.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 5.0       # 🔴 INCREASED from 2.0
      publish_frequency: 2.0      # 🔴 INCREASED from 1.0
      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 6.0
          obstacle_min_range: 0.3
          raytrace_max_range: 7.0
          raytrace_min_range: 0.3
          sensor_frame: laser
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35    # 🔴 INCREASED from 0.20
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.2    # 🔴 REDUCED from 1.0
      rolling_window: false
      width: 20
      height: 20
      resolution: 0.05
      update_frequency: 1.0
      publish_frequency: 0.5
      footprint: "[[0.35, 0.25], [0.35, -0.25], [-0.35, -0.25], [-0.35, 0.25]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_min_range: 0.3
          sensor_frame: laser
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35    # 🔴 INCREASED from 0.20
        cost_scaling_factor: 3.0
